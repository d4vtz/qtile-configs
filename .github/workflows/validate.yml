name: Validate Qtile config
on:
  push:
    branches: [main, refactor/dqtile-package]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q config.py dqtile desktop
